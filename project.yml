name: FocusLog
options:
  bundleIdPrefix: com.focuslog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
packages:
  PKCore:
    path: Packages/PKCore
targets:
  FocusLog:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
    dependencies:
      - package: PKCore
      - target: FocusLogWidget
        embed: true
        codeSign: false
    entitlements:
      path: App/FocusLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.focuslog.app
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 약효 곡선
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslog.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
  FocusLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Shared
    dependencies:
      - package: PKCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/FocusLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.focuslog.app
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 약효 곡선 위젯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuslog.app.widget
