name: Build IPA

on:
  push:
    paths:
      - "App/**"
      - "Widget/**"
      - "Shared/**"
      - "Packages/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 순수 계산 테스트는 값싼 리눅스 러너에서 먼저 돌린다.
  pk-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: PKCore unit tests
        working-directory: Packages/PKCore
        run: swift test

  build:
    needs: pk-tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project FocusLog.xcodeproj \
            -scheme FocusLog \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/FocusLog.app

      - name: Show errors
        if: failure()
        run: grep -n -B2 -A6 "error:" xcodebuild.log | head -200 || tail -100 xcodebuild.log

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FocusLog.app Payload/
          # 재서명 도구가 App Group을 알 수 있도록 엔타이틀먼트를 ad-hoc 서명으로 넣어 둔다.
          codesign -f -s - --entitlements Widget/FocusLogWidget.entitlements Payload/FocusLog.app/PlugIns/FocusLogWidget.appex
          codesign -f -s - --entitlements App/FocusLog.entitlements Payload/FocusLog.app
          codesign -d --entitlements - Payload/FocusLog.app || true
          zip -qry FocusLog.ipa Payload
          ls -lh FocusLog.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FocusLog-ipa
          path: FocusLog.ipa
          retention-days: 14
